<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back to work</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f4; --text: #1b1b1b; --muted: #6b6b6b; --accent: #1f9d55; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --text: #ececec; --muted: #9a9a9a; --accent: #3ccf7a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 17px/1.5 system-ui, 'Segoe UI', sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 40px; margin: 0 0 8px; color: var(--accent); }
    p { margin: 6px 0; color: var(--muted); }
    b { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Back to work</h1>
    <p><b id="site">This site</b> is blocked during your study session.</p>
    <p>It opens again in your break, or when the session ends.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
